# fm1mix configuration. Copy this file to autorun/fm1/fm1.conf on the card.
# Lines are key = value. Numbers only, except pcm and bank.

# Voice to load at start, 1..128 (FM1 V15 factory bank). MIDI Program Change
# selects another one while playing.
program = 1
# Volume 0..127 (MIDI CC 7 changes it).
volume = 100
# MIDI channel 1..16, or 0 for all channels.
channel = 0
# Polyphony 1..16.
voices = 8
# Expected sample rate of the MPC output; the synth is rebuilt if it differs.
rate = 44100
# 1 = one note at a time (legato), 0 = polyphonic.
mono = 0
# Transpose in semitones, -48..48.
transpose = 0
# Master gain at volume 127. 0.5 leaves headroom for the MPC's own mix.
gain = 0.5

# MIDI sources: 1 = on, 0 = off.
# midi_in : MIDI the MPC receives (MIDI IN or USB, as set in MIDI Config).
# midi_out: MIDI the MPC sends (a SampQOL MIDI track with its own MIDI Out
#           channel plays the synth from the sequencer).
# fifo    : /tmp/fm1.cmd and /tmp/fm1.midi for scripts.
midi_in = 1
midi_out = 1
fifo = 1

# Only mix into the playback device whose ALSA name contains this text.
# Leave empty for the first playback device. The names are in fm1mix.log.
pcm =
# Optional DX7 bank for voices 1-32: a 4096-byte VMEM file or a 4104-byte
# 32-voice SysEx dump (.syx), relative to the fm1 folder or absolute.
bank =
